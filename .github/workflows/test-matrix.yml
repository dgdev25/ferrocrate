name: Test Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run tests nightly at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # P0: Unit Tests - Fast, must pass for merge
  p0-unit-tests:
    name: P0 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run P0 Unit Tests
        run: |
          cargo test --workspace --lib --no-fail-fast -- -Z unstable-options --report-time
          --exclude ferro-desktop-ui 2>/dev/null || true
        shell: bash

      - name: Generate P0 Report
        if: always()
        run: |
          mkdir -p reports
          cargo test --workspace --lib -- -Z unstable-options --format=json --report-time 2>/dev/null | \
          jq -s '.[] | select(.type == "test") | {name: .name, status: .event, duration: .duration}' \
          > reports/p0-results.json || true

      - name: Upload P0 Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-report
          path: reports/

  # P1: Integration Tests - Real components
  p1-integration-tests:
    name: P1 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: p0-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run P1 Integration Tests
        run: |
          cargo test --workspace --test '*integration*' --no-fail-fast -- --test-threads=1
          --exclude ferro-desktop-ui 2>/dev/null || true

      - name: Generate P1 Report
        if: always()
        run: |
          mkdir -p reports
          cargo test --workspace --test '*integration*' -- -Z unstable-options --format=json 2>/dev/null | \
          jq -s '.[] | select(.type == "test") | {name: .name, status: .event, duration: .duration}' \
          > reports/p1-results.json || true

      - name: Upload P1 Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-test-report
          path: reports/

  # P2: E2E Tests - Full workflows
  p2-e2e-tests:
    name: P2 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: p1-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run P2 E2E Tests
        run: |
          cargo test --workspace --test '*e2e*' --no-fail-fast -- --test-threads=1
          --exclude ferro-desktop-ui 2>/dev/null || true

      - name: Generate P2 Report
        if: always()
        run: |
          mkdir -p reports
          cargo test --workspace --test '*e2e*' -- -Z unstable-options --format=json 2>/dev/null | \
          jq -s '.[] | select(.type == "test") | {name: .name, status: .event, duration: .duration}' \
          > reports/p2-results.json || true

      - name: Upload P2 Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-test-report
          path: reports/

  # P3: Property & Security Tests
  p3-property-security-tests:
    name: P3 Property & Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: p1-integration-tests
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Security Audit
        run: cargo audit --json > reports/security-audit.json || true

      - name: Run Property Tests
        run: |
          cargo test --workspace --test '*property*' --no-fail-fast
          --exclude ferro-desktop-ui 2>/dev/null || true

      - name: Run Security Tests
        run: |
          cargo test --workspace --test '*security*' --no-fail-fast
          --exclude ferro-desktop-ui 2>/dev/null || true

      - name: Upload P3 Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-test-report
          path: reports/

  # Coverage Report
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [p0-unit-tests, p1-integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate Coverage
        run: |
          cargo tarpaulin --workspace --exclude ferro-desktop-ui --out Xml --output-dir coverage/ \
          --timeout 300 --skip-clean

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          flags: unittests
          name: ferrocrate-coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Consolidated Report
  final-report:
    name: Generate Final Report
    runs-on: ubuntu-latest
    needs: [p0-unit-tests, p1-integration-tests, p2-e2e-tests, p3-property-security-tests, coverage]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Generate Consolidated Report
        run: |
          mkdir -p final-report

          # Create summary
          cat > final-report/summary.md << 'EOF'
          # FerroCrate Test Report

          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Summary

          | Priority | Status | Description |
          |----------|--------|-------------|
          | P0 | ${{ needs.p0-unit-tests.result }} | Unit Tests - Must Pass |
          | P1 | ${{ needs.p1-integration-tests.result }} | Integration Tests - Must Pass |
          | P2 | ${{ needs.p2-e2e-tests.result }} | E2E Tests - Should Pass |
          | P3 | ${{ needs.p3-property-security-tests.result }} | Property/Security - Informational |

          EOF

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-test-report
          path: final-report/

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('final-report/summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
