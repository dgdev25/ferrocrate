name: Linux packaging canary
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  package:
    runs-on: [self-hosted, linux, ferro-lab]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain present (self-hosted)
        shell: bash
        run: rustup show active-toolchain && cargo clippy --version
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux build deps present (self-hosted)
        shell: bash
        run: pkg-config --exists webkit2gtk-4.1 gtk+-3.0 && echo ok
      - run: npm ci
        working-directory: apps/ferro-desktop-ui
      - run: cargo build --release -p ferro-cli -p ferro-desktop && bash scripts/bundle-sidecars.sh
      - run: npm run tauri:build -- --bundles deb,appimage
        working-directory: apps/ferro-desktop-ui
        env: { TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}' }
      - run: bash scripts/inject-deb-maintainer-scripts.sh apps/ferro-desktop-ui/src-tauri/target/release/bundle/deb/*.deb
      - run: bash scripts/fix-appimage.sh apps/ferro-desktop-ui/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Secret-leak canary
        env: { FERROCRATE_SECRET_CANARY: ferrocrate-secret-canary-4815162342 }
        run: '! grep -R -a -F "$FERROCRATE_SECRET_CANARY" apps/ferro-desktop-ui/src-tauri/target/release/bundle'
