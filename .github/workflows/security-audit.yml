name: Security and Dependency Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit --deny warnings
      - name: Verify accepted advisory register is present
        run: test -s docs/SECURITY_RISK_ACCEPTANCE.md

  static-execution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell-out inventory references
        run: |
          test -s docs/security/shell-out-audit.md
          rg -q 'typed executor|justified' docs/security/shell-out-audit.md
          rg -q 'run_cmd|Command::new' ferro-core/src ferro-net/src ferro-netd/src
