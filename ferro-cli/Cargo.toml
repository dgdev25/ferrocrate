[package]
name = "ferro-cli"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
test-console = []
journald = ["ferro-core/journald"]
syslog = ["ferro-core/syslog"]

[dependencies]
clap = { workspace = true }
clap_complete = "4.5"
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = "0.9"
owo-colors = "4.0"
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
flate2 = "1.0"
tar = "0.4"
base64 = "0.22"
if-addrs = "0.13"
mdns-sd = "0.13"
uuid = { version = "1.0", features = ["v4"] }
tokio-tungstenite = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
ferro-core = { path = "../ferro-core" }
ferro-compose = { path = "../ferro-compose" }
ferro-net = { path = "../ferro-net" }
ferro-mind = { path = "../ferro-mind", features = ["rvf-persistence"] }
caps = { workspace = true }
nix = { workspace = true }
h2 = "0.4"
http = "1"
bytes = "1"
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-stream = "0.1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
proptest = { workspace = true }
ferro-core = { path = "../ferro-core" }
nix = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }

[[test]]
name = "macos_compatibility_tests"
path = "../tests/macos_compatibility_tests.rs"

[[test]]
name = "security_input_validation"
path = "../tests/security_input_validation.rs"

[[test]]
name = "property_image_reference"
path = "../tests/property_image_reference.rs"

[[test]]
name = "e2e_container_lifecycle"
path = "../tests/e2e_container_lifecycle.rs"

[[test]]
name = "authorization_compatibility"
path = "../tests/authorization_compatibility.rs"

[[test]]
name = "ai_multi_container_qualification"
path = "../tests/ai_multi_container_qualification.rs"

[[test]]
name = "emergency_unix_e2e"
path = "tests/emergency_unix_e2e.rs"
required-features = ["test-console"]
