<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="howitworks-dark-title howitworks-dark-desc">
      <title id="howitworks-dark-title">How ferrocrate runs a container</title>
      <desc id="howitworks-dark-desc">A command from the docker or ferrocrate CLI reaches the ferrocrate daemon over a Docker-compatible socket; the Rust runtime prepares image layers, namespaces, cgroups, and networking; the container runs as a normal Linux process.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- arrows first -->
      <line x1="220" y1="120" x2="264" y2="120" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="476" y1="120" x2="520" y2="120" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="732" y1="120" x2="776" y2="120" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- arrow labels: mask + text, 8px gap above stroke -->

      <!-- node 1: your command (input) -->
      <rect x="12" y="72" width="208" height="96" rx="6" fill="#2d3142"/>
      <rect x="12" y="72" width="208" height="96" rx="6" fill="rgba(191,192,192,0.10)" stroke="#9aa2b5" stroke-width="1"/>
      <rect x="20" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
      <text x="34" y="87" fill="rgba(191,192,192,0.95)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="116" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You run a command</text>
      <text x="116" y="140" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker · ferrocrate</text>

      <!-- node 2: daemon (focal) -->
      <rect x="268" y="72" width="208" height="96" rx="6" fill="#2d3142"/>
      <rect x="268" y="72" width="208" height="96" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <rect x="276" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="290" y="87" fill="rgba(240,138,89,0.95)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="372" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ferrocrate daemon</text>
      <text x="372" y="140" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Docker-compatible socket</text>

      <!-- node 3: runtime -->
      <rect x="524" y="72" width="208" height="96" rx="6" fill="#2d3142"/>
      <rect x="524" y="72" width="208" height="96" rx="6" fill="#3a3f54" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="532" y="78" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="548" y="87" fill="rgba(245,245,245,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="628" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rust runtime</text>
      <text x="628" y="140" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">layers · netns · cgroups</text>

      <!-- node 4: container (store treatment) -->
      <rect x="780" y="72" width="208" height="96" rx="6" fill="#2d3142"/>
      <rect x="780" y="72" width="208" height="96" rx="6" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="788" y="78" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
      <text x="804" y="87" fill="rgba(191,192,192,0.95)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
      <text x="884" y="122" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your container</text>
      <text x="884" y="140" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a normal Linux process</text>
    </svg>