# cargo-deny policy. Run: cargo deny check licenses advisories
# Advisory exceptions mirror .cargo/audit.toml; scripts/check-advisory-exceptions.py
# enforces owner and expiry for each one.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # bincode 1.x/2.x is feature-complete and archived upstream; pulled in by
  # ruvector-core. Time-bounded exception, see .cargo/audit.toml.
  "RUSTSEC-2025-0141",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  # Weak copyleft: only obligations are on modifying the crate itself.
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
