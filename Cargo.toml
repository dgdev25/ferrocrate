[workspace]
members = [
  "ferro-cri",
  "ferro-core",
  "ferro-net",
  "ferro-mind",
  "ferro-compose",
  "ferro-cli", "ferro-desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
missing_crate_level_docs = "allow"
