name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all

  build-linux:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build verified public release artifacts
        run: |
          scripts/build-release-artifacts.sh \
            --version "$GITHUB_REF_NAME" \
            --channel public \
            --output-dir release-artifacts \
            --target-os linux \
            --target-arch x86_64

      - name: Verify release channel and generate notes
        run: |
          scripts/verify-release-channel-artifacts.sh \
            --channel public \
            --version "$GITHUB_REF_NAME" \
            --artifact-dir release-artifacts
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            scripts/generate-changelog.sh --from "$previous" --to "$GITHUB_REF_NAME" \
              --output release-artifacts/CHANGELOG.md
          else
            FERROCRATE_RELEASE_VERSION="$GITHUB_REF_NAME" \
              scripts/generate-changelog.sh --to "$GITHUB_REF_NAME" \
              --output release-artifacts/CHANGELOG.md
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
