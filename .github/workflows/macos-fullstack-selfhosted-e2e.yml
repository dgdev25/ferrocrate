name: macos-fullstack-selfhosted-e2e

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "ferro-cli/**"
      - "ferro-core/**"
      - "ferro-desktop/**"
      - "scripts/install-macos.sh"
      - ".github/workflows/macos-fullstack-selfhosted-e2e.yml"

jobs:
  fullstack:
    runs-on: [self-hosted, macOS, ferrocrate-e2e]
    timeout-minutes: 45
    env:
      FERROCRATE_DESKTOP_BIN: target/debug/ferro-desktop
      FERROCRATE_DESKTOP_FORWARD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build ferrocrate and ferro-desktop
        run: cargo build -p ferro-cli -p ferro-desktop

      - name: Host dependency preflight
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) qemu_bin="qemu-system-aarch64" ;;
            x86_64) qemu_bin="qemu-system-x86_64" ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          for bin in qemu-img "$qemu_bin" virtiofsd ssh; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "missing required host dependency: $bin" >&2
              exit 1
            }
          done

      - name: Validate paid bootstrap env
        run: |
          set -euo pipefail
          for var in PAID_RELEASE_BASE_URL PAID_RELEASE_TOKEN_ENDPOINT PAID_SESSION_TOKEN; do
            if [[ -z "${!var:-}" ]]; then
              echo "missing required env/secret: $var" >&2
              exit 1
            fi
          done

      - name: Run macOS compatibility integration tests
        run: cargo test -p ferro-cli --test macos_compatibility_tests -- --nocapture

      - name: Full-stack doctor bootstrap
        run: |
          set -euo pipefail
          target/debug/ferrocrate doctor --fix --bootstrap --json > doctor-report.json
          cat doctor-report.json

      - name: Verify guest VM state and SSH reachability
        run: |
          set -euo pipefail
          target/debug/ferro-desktop vm status --json > vm-status.json
          cat vm-status.json

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-fullstack-selfhosted-e2e
          path: |
            doctor-report.json
            vm-status.json
