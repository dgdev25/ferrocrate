name: spring-petclinic
repo: https://github.com/spring-projects/spring-petclinic
pin: main
license: Apache-2.0
class: greenfield
stack: java
base_image: eclipse-temurin:21-jdk
start: java -jar /app.jar
port: 8080
health: /actuator/health
data_paths: []
env: {}
skip: [compose-health]
note: repo ships docker-compose.yml for databases only (compose-health skipped: no app service in it); the app image is generated; slow JVM start, health waits up to 60 s
