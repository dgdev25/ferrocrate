name: Windows packaging canary
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
permissions: { contents: read }
jobs:
  package:
    runs-on: [self-hosted, windows, ferro-lab]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SYSTEM runner profile for Tauri toolchains
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-windows-runner.ps1
      - name: Toolchain present (self-hosted)
        shell: bash
        run: rustup show && cargo clippy --version
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/ferro-desktop-ui
        env:
          USERPROFILE: E:\ferrocrate-runner-profile
          HOMEDRIVE: E:
          HOMEPATH: \ferrocrate-runner-profile
          APPDATA: E:\ferrocrate-runner-profile\AppData\Roaming
          LOCALAPPDATA: E:\ferrocrate-runner-profile\AppData\Local
          TEMP: E:\ferrocrate-runner-profile\Temp
          TMP: E:\ferrocrate-runner-profile\Temp
      - shell: bash
        run: npm run --prefix apps/ferro-desktop-ui build && cargo build --release -p ferro-cli -p ferro-desktop && bash scripts/bundle-sidecars.sh
        env:
          USERPROFILE: E:\ferrocrate-runner-profile
          HOMEDRIVE: E:
          HOMEPATH: \ferrocrate-runner-profile
          APPDATA: E:\ferrocrate-runner-profile\AppData\Roaming
          LOCALAPPDATA: E:\ferrocrate-runner-profile\AppData\Local
          TEMP: E:\ferrocrate-runner-profile\Temp
          TMP: E:\ferrocrate-runner-profile\Temp
      - run: npm run tauri:build -- --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
        working-directory: apps/ferro-desktop-ui
        env:
          USERPROFILE: E:\ferrocrate-runner-profile
          HOMEDRIVE: E:
          HOMEPATH: \ferrocrate-runner-profile
          APPDATA: E:\ferrocrate-runner-profile\AppData\Roaming
          LOCALAPPDATA: E:\ferrocrate-runner-profile\AppData\Local
          TEMP: E:\ferrocrate-runner-profile\Temp
          TMP: E:\ferrocrate-runner-profile\Temp
      - name: Secret-leak canary
        shell: bash
        env: { FERROCRATE_SECRET_CANARY: ferrocrate-secret-canary-4815162342 }
        run: '! grep -R -a -F "$FERROCRATE_SECRET_CANARY" apps/ferro-desktop-ui/src-tauri/target/release/bundle'
