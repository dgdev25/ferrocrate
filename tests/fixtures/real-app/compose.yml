# Representative local application: web + API + database + worker. It uses a
# project-owned network so the rootless runtime can create an isolated lease.
services:
  web:
    image: ${FERROCRATE_REAL_APP_BUSYBOX_IMAGE:-public.ecr.aws/docker/library/busybox:latest}
    command: ["sh", "-c", "httpd -f -p 18091 -h /srv"]
    volumes:
      - ./webroot:/srv
    ports: ["18091:18091"]
    networks: [app]
  api:
    image: ${FERROCRATE_REAL_APP_BUSYBOX_IMAGE:-public.ecr.aws/docker/library/busybox:latest}
    command: ["sh", "-c", "httpd -f -p 18092 -h /srv"]
    volumes:
      - ./apiroot:/srv
    ports: ["18092:18092"]
    networks: [app]
    depends_on:
      - db
  db:
    image: ${FERROCRATE_REAL_APP_DB_IMAGE:-public.ecr.aws/docker/library/redis:7-alpine}
    command: ["redis-server", "--port", "16399", "--save", "", "--appendonly", "no"]
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16399", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
  worker:
    image: ${FERROCRATE_REAL_APP_BUSYBOX_IMAGE:-public.ecr.aws/docker/library/busybox:latest}
    command: ["sh", "-c", "while true; do date +%s > /var/lib/worker/heartbeat; sleep 1; done"]
    volumes:
      - workerdata:/var/lib/worker
    networks: [app]
    depends_on:
      - db
volumes:
  workerdata: {}
networks:
  app: {}
