[package]
name = "ferro-cri"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
prost = "0.12"
prost-types = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.11", features = ["transport"] }

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3"
