name: Desktop Packaging

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ferro-desktop release
        run: cargo build -p ferro-desktop --release
      - name: Create app bundle and dmg
        run: scripts/package-macos-app.sh
      - name: Sign and notarize macOS artifacts
        if: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: scripts/sign-macos-artifacts.sh
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferro-desktop-macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.app

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ferro-desktop release
        run: cargo build -p ferro-desktop --release
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Ensure WiX in PATH
        shell: pwsh
        run: echo "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Create MSI
        shell: pwsh
        run: scripts/package-windows-msi.ps1 -BinaryPath .\target\release\ferro-desktop.exe -OutputDir .\dist\windows -ProductVersion 0.1.0
      - name: Sign MSI artifact
        if: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: scripts/sign-windows-artifacts.ps1 -MsiPath .\dist\windows\ferro-desktop-0.1.0.msi
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferro-desktop-windows
          path: |
            dist/windows/*.msi
            dist/windows/*.wxs
