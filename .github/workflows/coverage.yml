name: Test Coverage

on:
  push:
    branches: [ "main" ]
    paths:
      - "ferro-cli/**"
      - "ferro-core/**"
      - "ferro-cri/**"
      - "ferro-mind/**"
      - "ferro-net/**"
      - "ferro-compose/**"
      - "Cargo.toml"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "ferro-cli/**"
      - "ferro-core/**"
      - "ferro-cri/**"
      - "ferro-mind/**"
      - "ferro-net/**"
      - "ferro-compose/**"
      - "Cargo.toml"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --profile coverage --workspace --lcov --output-path lcov.info
        env:
          # Skip root-required tests in CI
          FERROCRATE_SKIP_ROOT_TESTS: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

      - name: Coverage summary
        run: |
          cargo llvm-cov --profile coverage --workspace --summary-only 2>/dev/null || true
        env:
          FERROCRATE_SKIP_ROOT_TESTS: "1"
