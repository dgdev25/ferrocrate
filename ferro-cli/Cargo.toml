[package]
name = "ferro-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { workspace = true }
clap_complete = "4.5"
ferro-core = { path = "../ferro-core" }
ferro-compose = { path = "../ferro-compose" }
ferro-mind = { path = "../ferro-mind", default-features = false }
serde_json = { workspace = true }
serde = { workspace = true }
owo-colors = "4.0"
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
caps = { workspace = true }
ferro-mind = { path = "../ferro-mind", features = ["rvf-persistence"] }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
proptest = { workspace = true }

[[test]]
name = "macos_compatibility_tests"
path = "../tests/macos_compatibility_tests.rs"

[[test]]
name = "security_input_validation"
path = "../tests/security_input_validation.rs"

[[test]]
name = "property_image_reference"
path = "../tests/property_image_reference.rs"

[[test]]
name = "e2e_container_lifecycle"
path = "../tests/e2e_container_lifecycle.rs"
