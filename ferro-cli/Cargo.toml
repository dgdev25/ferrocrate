[package]
name = "ferro-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ferro-core = { path = "../ferro-core" }
ferro-compose = { path = "../ferro-compose" }
ferro-mind = { path = "../ferro-mind", default-features = false }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
owo-colors = "4.0"
tempfile = "3.13"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"
ferro-mind = { path = "../ferro-mind", features = ["rvf-persistence"] }

[dev-dependencies]

[[test]]
name = "macos_compatibility_tests"
path = "../tests/macos_compatibility_tests.rs"
