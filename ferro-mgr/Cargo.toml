[package]
name = "ferro-mgr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
ferro-core = { path = "../ferro-core" }
ferro-web = { path = "../ferro-web" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
fs2 = "0.4"
prost = "0.14"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ipnet = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tempfile = { workspace = true }
base64 = "0.22"
getrandom = "0.3"
ed25519-dalek = "2"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
nix = { workspace = true, features = ["user", "socket", "fs"] }
rustix = { version = "1", features = ["process"] }
x509-parser = "0.18"
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
ferro-netd = { path = "../ferro-netd", features = ["test-support"] }
ferro-core = { path = "../ferro-core", features = ["test-support"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
