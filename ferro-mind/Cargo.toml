[package]
name = "ferro-mind"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"

# rUv ecosystem integration (Task 3.3)
# Uses ruvector-core for lightweight HashEmbedding by default
ruvector-core = { version = "2.0.3", default-features = false, features = ["simd", "parallel"] }
ruv-fann = { version = "0.2.0", default-features = false, features = ["std", "parallel"] }  # Neural networks for anomaly detection without binary serialization

parking_lot = "0.12"   # Required for ruvector-core RwLock interop
tracing = { workspace = true }

# Training pipeline dependencies (Task 5.4)
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# RVF persistence layer (optional)
rvf-runtime = { version = "0.2", default-features = false, features = ["std"], optional = true }
rvf-types = { version = "0.2" }
rvf-quant = { version = "0.2" }
rvf-index = { version = "0.2" }

[features]
default = ["rvf-persistence"]
rvf-persistence = ["dep:rvf-runtime"]
legacy-memory = []

[dev-dependencies]
tempfile = { workspace = true }
