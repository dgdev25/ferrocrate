name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  candidate-validation:
    uses: ./.github/workflows/ci.yml

  candidate-qualification:
    needs: candidate-validation
    # An isolated, privileged qualification host is required. Ordinary build
    # runners must never silently stand in for host/fault qualification.
    runs-on: [self-hosted, linux, x64, ferro-release-qualified]
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      FERROCRATE_READINESS_REQUIRED: rootful,apparmor,rootless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix apps/ferro-desktop-ui
      - name: Qualify this exact tag
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ferro-release-target"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(id -u)" = 0
          bash scripts/local-release-gate.sh --version "$GITHUB_REF_NAME"

  cli:
    name: CLI ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: [self-hosted, linux, x64, ferro-lab], target: x86_64-unknown-linux-gnu, target_os: linux, arch: x86_64 }
          - { runner: [self-hosted, linux, arm64, ferro-lab], target: aarch64-unknown-linux-gnu, target_os: linux, arch: aarch64 }
          - { runner: [self-hosted, macos, ferro-lab], target: x86_64-apple-darwin, target_os: macos, arch: x86_64 }
          - { runner: [self-hosted, macos, ferro-lab], target: aarch64-apple-darwin, target_os: macos, arch: aarch64 }
          - { runner: [self-hosted, windows, ferro-lab], target: x86_64-pc-windows-msvc, target_os: windows, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain present (self-hosted)
        shell: bash
        run: rustup show && rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Frontend for the embedded dashboard
        shell: bash
        run: cd apps/ferro-desktop-ui && npm ci && npm run build
      - name: Build archive, checksum, provenance, and Linux deb
        shell: bash
        run: bash scripts/build-release-artifacts.sh --version "$GITHUB_REF_NAME" --target-os '${{ matrix.target_os }}' --target-arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          retention-days: 7
          path: dist/release/*
          if-no-files-found: error

  linux-desktop:
    runs-on: [self-hosted, linux, x64, ferro-lab]
    environment: release
    timeout-minutes: 75
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain present (self-hosted)
        shell: bash
        run: rustup show && cargo clippy --version
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux build deps present (self-hosted)
        shell: bash
        run: pkg-config --exists webkit2gtk-4.1 gtk+-3.0 && echo ok
      - run: npm ci
        working-directory: apps/ferro-desktop-ui
      - run: node scripts/configure-updater-key.mjs
      - run: npm run --prefix apps/ferro-desktop-ui build && cargo build --release -p ferro-cli -p ferro-desktop && bash scripts/bundle-sidecars.sh
      - run: npm run tauri:build -- --bundles deb,appimage
        working-directory: apps/ferro-desktop-ui
      - run: bash scripts/inject-deb-maintainer-scripts.sh apps/ferro-desktop-ui/src-tauri/target/release/bundle/deb/*.deb
      - run: bash scripts/fix-appimage.sh apps/ferro-desktop-ui/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Secret-leak canary
        env: { FERROCRATE_SECRET_CANARY: ferrocrate-secret-canary-4815162342 }
        run: '! grep -R -a -F "$FERROCRATE_SECRET_CANARY" apps/ferro-desktop-ui/src-tauri/target/release/bundle'
      - run: bash scripts/test-package-linux.sh apps/ferro-desktop-ui/src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          retention-days: 7
          path: |
            apps/ferro-desktop-ui/src-tauri/target/release/bundle/deb/*.deb
            apps/ferro-desktop-ui/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/ferro-desktop-ui/src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

  macos-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: aarch64 }
    runs-on: [self-hosted, macos, ferro-lab]
    environment: release
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain present (self-hosted)
        shell: bash
        run: rustup show && rustup target add ${{ matrix.target }} && cargo clippy --version
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/ferro-desktop-ui
      - run: node scripts/configure-updater-key.mjs
      - run: npm run --prefix apps/ferro-desktop-ui build && cargo build --release --target ${{ matrix.target }} -p ferro-cli -p ferro-desktop && bash scripts/bundle-sidecars.sh ${{ matrix.target }}
      - name: Build unsigned app and DMG
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles app,dmg
        working-directory: apps/ferro-desktop-ui
      - name: Locate unsigned DMG
        id: unsigned
        run: echo "dmg=$(find apps/ferro-desktop-ui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -print -quit)" >> "$GITHUB_OUTPUT"
      - name: Codesign and notarize
        id: codesign
        uses: block/apple-codesign-action@679535d1ab7c5a7c18e6f9afcba3464512cc3dde
        with:
          osx-codesign-role: ${{ secrets.OSX_CODESIGN_ROLE }}
          codesign-s3-bucket: ${{ secrets.CODESIGN_S3_BUCKET }}
          unsigned-artifact-path: ${{ steps.unsigned.outputs.dmg }}
          entitlements-plist-path: apps/ferro-desktop-ui/src-tauri/Entitlements.plist
          artifact-name: ferrocrate-${{ github.sha }}-${{ github.run_id }}-${{ matrix.arch }}
      - name: Replace signed DMG and rebuild signed updater archive
        env:
          SIGNED_DMG: ${{ steps.codesign.outputs.signed-dmg-path }}
          SIGNED_APP_ZIP: ${{ steps.codesign.outputs.signed-artifact-path }}
          UNSIGNED_DMG: ${{ steps.unsigned.outputs.dmg }}
        run: |
          cp "$SIGNED_DMG" "$UNSIGNED_DMG"
          app_dir=apps/ferro-desktop-ui/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          extract="$RUNNER_TEMP/signed-app-${{ matrix.arch }}"
          mkdir -p "$extract" && ditto -x -k "$SIGNED_APP_ZIP" "$extract"
          rm -rf "$app_dir/FerroCrate Desktop.app"
          cp -R "$extract/FerroCrate Desktop.app" "$app_dir/FerroCrate Desktop.app"
          rm -f "$app_dir"/*.app.tar.gz "$app_dir"/*.app.tar.gz.sig
          tar -C "$app_dir" -czf "$app_dir/FerroCrate_Desktop_${{ matrix.arch }}.app.tar.gz" 'FerroCrate Desktop.app'
          npm exec --prefix apps/ferro-desktop-ui --no -- tauri signer sign "$app_dir/FerroCrate_Desktop_${{ matrix.arch }}.app.tar.gz"
      - run: bash scripts/test-package-macos.sh apps/ferro-desktop-ui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          retention-days: 7
          path: |
            apps/ferro-desktop-ui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/ferro-desktop-ui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  windows-desktop:
    runs-on: [self-hosted, windows, ferro-lab]
    environment: release
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain present (self-hosted)
        shell: bash
        run: rustup show && cargo clippy --version
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/ferro-desktop-ui
      - run: node scripts/configure-updater-key.mjs
        env: { TAURI_UPDATER_PUBLIC_KEY: '${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}' }
      - shell: bash
        run: npm run --prefix apps/ferro-desktop-ui build && cargo build --release -p ferro-cli -p ferro-desktop && bash scripts/bundle-sidecars.sh
      - run: npm run tauri:build -- --bundles nsis,msi
        working-directory: apps/ferro-desktop-ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Signer failure and cleanup regression tests
        shell: pwsh
        run: ./scripts/test-windows-signing.ps1
      - name: Authenticode sign installers
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem apps/ferro-desktop-ui/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe)
          if ($installers.Count -eq 0) { throw 'No Windows installers found' }
          $installers | ForEach-Object {
            ./scripts/sign-windows-artifacts.ps1 -MsiPath $_.FullName
            # Authenticode changes installer bytes: discard the pre-signing updater signature.
            Remove-Item -LiteralPath "$($_.FullName).sig" -Force -ErrorAction SilentlyContinue
            npm exec --prefix apps/ferro-desktop-ui --no -- tauri signer sign $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Updater signing failed' }
            if (!(Test-Path "$($_.FullName).sig")) { throw 'Updater signature missing' }
          }
      - shell: bash
        run: bash scripts/test-package-windows.sh apps/ferro-desktop-ui/src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          retention-days: 7
          path: |
            apps/ferro-desktop-ui/src-tauri/target/release/bundle/msi/*.msi
            apps/ferro-desktop-ui/src-tauri/target/release/bundle/msi/*.sig
            apps/ferro-desktop-ui/src-tauri/target/release/bundle/nsis/*.exe
            apps/ferro-desktop-ui/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  publish:
    needs: [candidate-validation, candidate-qualification, cli, linux-desktop, macos-desktop, windows-desktop]
    environment: release
    runs-on: [self-hosted, linux, x64, ferro-lab]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: release-artifacts }
      - name: Checksums
        run: find release-artifacts -type f ! -name '*.sha256' -exec sha256sum {} + > release-artifacts/SHA256SUMS
      - name: Updater manifest
        run: node scripts/build-updater-manifest.mjs --dir release-artifacts --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --version "${GITHUB_REF_NAME#v}" --out release-artifacts/latest.json
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: 'release-artifacts/**' }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
            release-artifacts/latest.json
          fail_on_unmatched_files: true
