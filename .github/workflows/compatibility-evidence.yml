name: compatibility-evidence

on:
  push:
    branches: [ "desktop-app", "main" ]
    paths:
      - "ferro-cli/**"
      - "ferro-core/**"
      - "ferro-mind/**"
      - "scripts/compat-evidence.sh"
      - "scripts/perf/oci-compat.sh"
      - ".github/workflows/compatibility-evidence.yml"
  pull_request:
    paths:
      - "ferro-cli/**"
      - "ferro-core/**"
      - "ferro-mind/**"
      - "scripts/compat-evidence.sh"
      - "scripts/perf/oci-compat.sh"
      - ".github/workflows/compatibility-evidence.yml"
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Collect compatibility evidence
        run: bash scripts/compat-evidence.sh
      - name: Upload compatibility evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-evidence
          path: target/compat/
