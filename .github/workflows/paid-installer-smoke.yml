name: Paid Installer Smoke

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos-paid-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare fake paid artifacts
        run: |
          set -euo pipefail
          TAG="v0.0.0-ci"
          ARCH_RAW="$(uname -m)"
          case "$ARCH_RAW" in
            arm64|aarch64) ARCH="aarch64" ;;
            x86_64) ARCH="x86_64" ;;
            *) echo "unsupported arch: $ARCH_RAW" >&2; exit 1 ;;
          esac
          ROOT="$RUNNER_TEMP/paid-artifacts/$TAG"
          mkdir -p "$ROOT/payload"
          printf '%s\n' '#!/usr/bin/env bash' 'printf "ferrocrate smoke binary\\n"' > "$ROOT/payload/ferrocrate"
          chmod +x "$ROOT/payload/ferrocrate"
          ASSET="ferrocrate-${TAG}-macos-${ARCH}.tar.gz"
          (cd "$ROOT/payload" && tar -czf "$ROOT/$ASSET" ferrocrate)
          CHECKSUM_FILE="ferrocrate-${TAG}-paid-checksums.txt"
          (cd "$ROOT" && shasum -a 256 "$ASSET" > "$CHECKSUM_FILE")

      - name: Start local paid gateway
        run: |
          set -euo pipefail
          export PAID_ARTIFACT_ROOT="$RUNNER_TEMP/paid-artifacts"
          export PAID_GATEWAY_SIGNING_SECRET="ci-signing-secret"
          export PAID_GATEWAY_AUTH_MODE="session"
          export PAID_SESSION_JWT_SECRET="ci-session-secret"
          nohup python3 scripts/paid-artifact-gateway.py > "$RUNNER_TEMP/paid-gateway.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/paid-gateway.pid"
          for _ in $(seq 1 20); do
            if nc -z 127.0.0.1 9090 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "gateway failed to start" >&2
          cat "$RUNNER_TEMP/paid-gateway.log" >&2 || true
          exit 1

      - name: Run paid macOS installer via session token
        run: |
          set -euo pipefail
          TAG="v0.0.0-ci"
          SESSION_TOKEN="$(python3 -c 'import base64,hashlib,hmac,json,time; enc=lambda d: base64.urlsafe_b64encode(json.dumps(d,separators=(",",":")).encode()).decode().rstrip("="); h=enc({"alg":"HS256","typ":"JWT"}); p=enc({"sub":"ci-user","plan":"pro","features":["desktop"],"exp":int(time.time())+600,"jti":"ci-macos-1"}); msg=f"{h}.{p}".encode(); s=base64.urlsafe_b64encode(hmac.new(b"ci-session-secret",msg,hashlib.sha256).digest()).decode().rstrip("="); print(msg.decode()+"."+s)')"
          export PAID_RELEASE_BASE_URL="http://127.0.0.1:9090/v1/releases/{tag}"
          export PAID_RELEASE_TOKEN_ENDPOINT="http://127.0.0.1:9090/v1/token"
          export PAID_SESSION_TOKEN="$SESSION_TOKEN"
          PREFIX="$RUNNER_TEMP/bin"
          scripts/install-macos.sh --channel paid --version "$TAG" --cli-only --prefix "$PREFIX" --force
          test -x "$PREFIX/ferrocrate"

      - name: Stop local paid gateway
        if: always()
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/paid-gateway.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/paid-gateway.pid")" >/dev/null 2>&1 || true
          fi

  windows-paid-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare fake paid artifacts
        shell: pwsh
        run: |
          $tag = 'v0.0.0-ci'
          switch ($env:PROCESSOR_ARCHITECTURE.ToUpperInvariant()) {
            'AMD64' { $arch = 'x86_64' }
            'ARM64' { $arch = 'aarch64' }
            default { throw "Unsupported arch: $env:PROCESSOR_ARCHITECTURE" }
          }
          $root = Join-Path $env:RUNNER_TEMP "paid-artifacts\$tag"
          $payload = Join-Path $root 'payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Set-Content -Path (Join-Path $payload 'ferrocrate.exe') -Value 'ferrocrate smoke binary' -NoNewline
          $asset = "ferrocrate-$tag-windows-$arch.zip"
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath (Join-Path $root $asset) -Force
          $checksum = (Get-FileHash -Path (Join-Path $root $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $root "ferrocrate-$tag-paid-checksums.txt") -Value "$checksum  $asset"

      - name: Start local paid gateway
        shell: pwsh
        run: |
          $env:PAID_ARTIFACT_ROOT = Join-Path $env:RUNNER_TEMP 'paid-artifacts'
          $env:PAID_GATEWAY_SIGNING_SECRET = 'ci-signing-secret'
          $env:PAID_GATEWAY_AUTH_MODE = 'session'
          $env:PAID_SESSION_JWT_SECRET = 'ci-session-secret'
          $proc = Start-Process -FilePath py -ArgumentList '-3 scripts/paid-artifact-gateway.py' -PassThru
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'paid-gateway.pid') -Value $proc.Id
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient
              $tcp.Connect('127.0.0.1', 9090)
              $tcp.Close()
              $ready = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) { throw 'gateway failed to start' }

      - name: Run paid Windows installer via session token
        shell: pwsh
        run: |
          function Base64Url([byte[]]$bytes) {
            return [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+', '-').Replace('/', '_')
          }
          $tag = 'v0.0.0-ci'
          $headerJson = '{"alg":"HS256","typ":"JWT"}'
          $payloadObj = [ordered]@{
            sub = 'ci-user'
            plan = 'pro'
            features = @('desktop')
            exp = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + 600)
            jti = 'ci-win-1'
          }
          $payloadJson = ($payloadObj | ConvertTo-Json -Compress)
          $header = Base64Url ([Text.Encoding]::UTF8.GetBytes($headerJson))
          $payload = Base64Url ([Text.Encoding]::UTF8.GetBytes($payloadJson))
          $signingInput = "$header.$payload"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256 ([Text.Encoding]::UTF8.GetBytes('ci-session-secret'))
          $sig = Base64Url ($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($signingInput)))
          $session = "$signingInput.$sig"

          $prefix = Join-Path $env:RUNNER_TEMP 'bin'
          .\scripts\install-windows.ps1 `
            -Channel paid `
            -Version $tag `
            -CliOnly `
            -Prefix $prefix `
            -Force `
            -PaidReleaseBaseUrl 'http://127.0.0.1:9090/v1/releases/{tag}' `
            -PaidReleaseTokenEndpoint 'http://127.0.0.1:9090/v1/token' `
            -PaidSessionToken $session
          if (-not (Test-Path (Join-Path $prefix 'ferrocrate.exe'))) {
            throw 'ferrocrate.exe was not installed'
          }

      - name: Stop local paid gateway
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'paid-gateway.pid'
          if (Test-Path $pidFile) {
            $pid = Get-Content -Path $pidFile -Raw
            if ($pid) {
              Stop-Process -Id ([int]$pid) -Force -ErrorAction SilentlyContinue
            }
          }
