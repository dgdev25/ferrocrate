[package]
name = "ferro-core"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.0"
nix = { version = "0.30", features = ["process", "sched", "signal", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
thiserror = "2.0"
zstd = "0.13"

[dev-dependencies]
base64 = "0.22"
httptest = "0.16"
tempfile = "3.13"
