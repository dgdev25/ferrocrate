[workspace]
members = [
  "ferro-cri",
  "ferro-core",
  "ferro-net",
  "ferro-netd",
  "ferro-mgr",
  "ferro-net-ebpf",
  "ferro-security-ebpf",
  "ferro-mind",
  "ferro-compose",
  "ferro-cli", "ferro-desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "allow"

# Shared dependencies for logging (CQ-03)
[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aya = "=0.14.0"
aya-build = "=0.2.0"
aya-ebpf = "=0.2.1"
network-types = { version = "=0.2.0", default-features = false }

# Common dependencies (ARCH-02)
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
clap = { version = "4.5", features = ["derive"] }
caps = "0.5"
nix = { version = "0.30", default-features = false, features = ["process", "signal", "user", "sched", "mount", "term"] }

# Test dependencies
proptest = "1.5"

# Coverage profile for test coverage tracking (TEST-08)
# Usage: cargo test --profile coverage
# Generates .gcno/.gcda files for llvm-cov
[profile.coverage]
inherits = "test"
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 1
opt-level = 0
rpath = true
